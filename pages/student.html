<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Điểm danh — Sinh viên</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="../css/main.css">
</head>
<body class="min-h-screen bg-slate-50 text-slate-900">

<header class="brand-bar text-white">
  <div class="mx-auto flex max-w-lg items-center gap-3 px-4 py-3">
    <a href="../index.html" class="text-white/80 hover:text-white">&larr;</a>
    <h1 class="text-base font-bold">Điểm danh sinh viên</h1>
  </div>
</header>

<main class="mx-auto max-w-lg px-4 py-6">

  <div id="gps-status" class="flex items-center gap-2 rounded-lg border border-amber-200 bg-amber-50 px-3 py-2 text-sm text-amber-800">
    <span id="gps-text">Đang lấy vị trí…</span>
  </div>

  <form id="checkin-form" class="mt-4 space-y-4 rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">

    <div>
      <label for="mssv" class="block text-sm font-medium text-slate-700">Mã số sinh viên</label>
      <input id="mssv" name="mssv" type="text" inputmode="numeric" autocomplete="off"
             maxlength="10" required placeholder="22123456"
             class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-3 text-lg focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200">
    </div>

    <div>
      <label for="code" class="block text-sm font-medium text-slate-700">Mã điểm danh (4 ký tự)</label>
      <input id="code" name="code" type="text" autocomplete="off" autocapitalize="characters"
             spellcheck="false" maxlength="4" required placeholder="A8K2"
             class="code-input mt-1 w-full rounded-lg border border-slate-300 px-3 py-3 text-center text-2xl font-bold uppercase focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200">
      <p class="mt-1 text-xs text-slate-500">Giảng viên đọc hoặc chiếu mã này trên lớp.</p>
    </div>

    <button id="submit-btn" type="submit"
            class="w-full rounded-lg bg-blue-700 px-4 py-3 text-base font-semibold text-white transition hover:bg-blue-800 disabled:bg-slate-300">
      Gửi điểm danh
    </button>
  </form>

  <div id="result" class="mt-4" hidden></div>

  <section id="history-box" class="mt-6 rounded-2xl border border-slate-200 bg-white p-4 shadow-sm" hidden>
    <h2 class="mb-2 font-semibold">Lịch sử điểm danh</h2>
    <div class="table-wrap">
      <table class="w-full text-left text-sm">
        <thead class="text-xs uppercase text-slate-500">
          <tr><th class="px-3 py-2">Buổi</th><th class="px-3 py-2">Ngày</th>
              <th class="px-3 py-2">Nội dung</th><th class="px-3 py-2">Trạng thái</th></tr>
        </thead>
        <tbody id="history-table"></tbody>
      </table>
    </div>
  </section>

  <p class="mt-6 text-center text-xs text-slate-400">
    Hệ thống ghi lại thời điểm, vị trí và thiết bị của lượt điểm danh này.
  </p>
</main>

<script src="../js/config/config.js"></script>
<script src="../js/models/Student.js"></script>
<script src="../js/models/ClassSession.js"></script>
<script src="../js/models/Attendance.js"></script>
<script src="../js/services/APIService.js"></script>
<script src="../js/services/DeviceService.js"></script>
<script src="../js/views/StudentView.js"></script>
<script src="../js/controllers/StudentController.js"></script>
<script>
  // Không có logic nghiệp vụ trong HTML — chỉ nối dây (thiết kế B.3)
  document.addEventListener('DOMContentLoaded', function () {
    new StudentController(new APIService(CONFIG.API_URL), new StudentView()).init();
  });
</script>
</body>
</html>
