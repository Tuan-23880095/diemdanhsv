<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bảng điều khiển — Giảng viên</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="../css/main.css">
<link rel="stylesheet" href="../css/print.css">
</head>
<body class="min-h-screen bg-slate-50 text-slate-900">

<header class="brand-bar text-white no-print">
  <div class="mx-auto flex max-w-5xl items-center justify-between gap-3 px-4 py-3">
    <div class="flex items-center gap-3">
      <a href="../index.html" class="text-white/80 hover:text-white">&larr;</a>
      <h1 class="text-base font-bold">Bảng điều khiển giảng viên</h1>
    </div>
    <div id="dash-user" class="flex items-center gap-3 text-sm">
      <span id="who" class="opacity-90"></span>
      <button id="logout-btn" class="rounded bg-white/15 px-3 py-1 hover:bg-white/25">Đăng xuất</button>
    </div>
  </div>
</header>

<main class="mx-auto max-w-5xl px-4 py-6">

  <!-- ĐĂNG NHẬP -->
  <section id="login-box" class="mx-auto max-w-sm rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
    <h2 class="text-lg font-bold">Đăng nhập</h2>
    <form id="login-form" class="mt-4 space-y-3">
      <div>
        <label for="username" class="block text-sm font-medium text-slate-700">Tên đăng nhập</label>
        <input id="username" type="text" autocomplete="username" required
               class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200">
      </div>
      <div>
        <label for="password" class="block text-sm font-medium text-slate-700">Mật khẩu</label>
        <input id="password" type="password" autocomplete="current-password" required
               class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200">
      </div>
      <p id="login-error" class="text-sm text-red-700" hidden></p>
      <button type="submit" class="w-full rounded-lg bg-blue-700 px-4 py-2 font-semibold text-white hover:bg-blue-800">
        Đăng nhập
      </button>
    </form>
  </section>

  <!-- BẢNG ĐIỀU KHIỂN -->
  <section id="dashboard" hidden>

    <div class="grid gap-3 sm:grid-cols-2 no-print">
      <div>
        <label for="class-select" class="block text-sm font-medium text-slate-700">Lớp</label>
        <select id="class-select" class="mt-1 w-full rounded-lg border border-slate-300 bg-white px-3 py-2">
          <option value="">— Chọn lớp —</option>
        </select>
      </div>
      <div>
        <label for="session-select" class="block text-sm font-medium text-slate-700">Buổi học</label>
        <select id="session-select" class="mt-1 w-full rounded-lg border border-slate-300 bg-white px-3 py-2">
          <option value="">— Chọn buổi —</option>
        </select>
      </div>
    </div>

    <div class="mt-3 flex flex-wrap gap-2 no-print">
      <button id="open-btn" disabled
              class="rounded-lg bg-emerald-700 px-4 py-2 font-semibold text-white hover:bg-emerald-800 disabled:bg-slate-300">
        Mở điểm danh
      </button>
      <button id="close-btn" disabled
              class="rounded-lg bg-slate-700 px-4 py-2 font-semibold text-white hover:bg-slate-800 disabled:bg-slate-300">
        Đóng điểm danh
      </button>
      <button type="button" id="print-btn"
              class="rounded-lg border border-slate-300 px-4 py-2 font-semibold text-slate-700 hover:bg-slate-100">
        In danh sách
      </button>
    </div>

    <!-- MÃ ĐIỂM DANH — chiếu lên máy chiếu -->
    <div id="code-box" class="mt-4 rounded-2xl border-2 border-blue-200 bg-blue-50 p-6 text-center" hidden>
      <p class="text-sm font-medium uppercase tracking-wide text-blue-700">Mã điểm danh</p>
      <p id="code-text" class="code-display font-black text-blue-900">----</p>
      <p id="code-until" class="mt-2 text-sm text-blue-700"></p>
    </div>

    <!-- ĐẾM -->
    <div class="mt-4 grid grid-cols-2 gap-3 sm:grid-cols-4">
      <div class="rounded-xl border border-slate-200 bg-white p-3">
        <p class="text-xs uppercase text-slate-500">Sĩ số</p>
        <p id="c-enrolled" class="text-2xl font-extrabold">0</p>
      </div>
      <div class="rounded-xl border border-emerald-200 bg-emerald-50 p-3">
        <p class="text-xs uppercase text-emerald-700">Có mặt</p>
        <p id="c-present" class="text-2xl font-extrabold text-emerald-900">0</p>
      </div>
      <div class="rounded-xl border border-amber-200 bg-amber-50 p-3">
        <p class="text-xs uppercase text-amber-700">Trễ</p>
        <p id="c-late" class="text-2xl font-extrabold text-amber-900">0</p>
      </div>
      <div class="rounded-xl border border-red-200 bg-red-50 p-3">
        <p class="text-xs uppercase text-red-700">Vắng</p>
        <p id="c-absent" class="text-2xl font-extrabold text-red-900">0</p>
      </div>
    </div>

    <!-- CẢNH BÁO (D.8-4, D.3) -->
    <ul id="alerts" class="mt-4 space-y-2 text-sm" hidden></ul>

    <div class="mt-4 grid gap-4 lg:grid-cols-3">
      <div class="lg:col-span-2 rounded-2xl border border-slate-200 bg-white p-4">
        <h2 class="mb-2 font-semibold">Đã điểm danh</h2>
        <div class="table-wrap">
          <table class="w-full text-left text-sm">
            <thead class="text-xs uppercase text-slate-500">
              <tr><th class="px-3 py-2">MSSV</th><th class="px-3 py-2">Họ tên</th>
                  <th class="px-3 py-2">Trạng thái</th><th class="px-3 py-2">Giờ</th>
                  <th class="px-3 py-2">Vị trí</th></tr>
            </thead>
            <tbody id="roster-table"></tbody>
          </table>
        </div>
      </div>

      <div class="rounded-2xl border border-slate-200 bg-white p-4">
        <h2 class="mb-2 font-semibold">Chưa điểm danh</h2>
        <div class="table-wrap">
          <table class="w-full text-left text-sm">
            <thead class="text-xs uppercase text-slate-500">
              <tr><th class="px-3 py-2">MSSV</th><th class="px-3 py-2">Họ tên</th></tr>
            </thead>
            <tbody id="absent-table"></tbody>
          </table>
        </div>
      </div>
    </div>

  </section>
</main>

<div id="toast" class="toast fixed bottom-4 left-1/2 -translate-x-1/2 rounded-lg bg-slate-900 px-4 py-2 text-sm text-white shadow-lg" hidden></div>

<script src="../js/config/config.js"></script>
<script src="../js/models/Student.js"></script>
<script src="../js/models/AcademicClass.js"></script>
<script src="../js/models/ClassSession.js"></script>
<script src="../js/models/Attendance.js"></script>
<script src="../js/services/APIService.js"></script>
<script src="../js/views/RosterView.js"></script>
<script src="../js/controllers/LecturerController.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    new LecturerController(new APIService(CONFIG.API_URL), new RosterView()).init();
    document.getElementById('print-btn').addEventListener('click', function () { window.print(); });
  });
</script>
</body>
</html>
