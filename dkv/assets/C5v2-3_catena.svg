<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="Catena và năm yếu tố sườn" xmlns:c2pa="http://c2pa.org/manifest"><title>Catena và năm yếu tố sườn</title><rect width="1200" height="700" fill="#FFFFFF"/><g style="font-family:'Be Vietnam Pro',system-ui,sans-serif"><text x="600.0" y="40" font-size="26" fill="#1F4E79" text-anchor="middle" font-weight="700" >Catena: năm yếu tố của một sườn phát triển đầy đủ</text><path d="M60,210 L300,210 C380,212 420,235 470,290 L700,470 C760,515 820,540 900,548 L1140,556 L1140,620 L60,620 Z" fill="#D6A130" opacity="0.25"/><path d="M60,210 L300,210 C380,212 420,235 470,290 L700,470 C760,515 820,540 900,548 L1140,556" fill="none" stroke="#10212B" stroke-width="4"/><text x="180" y="90" font-size="20" fill="#0F6B55" text-anchor="middle" font-weight="700" >Đỉnh (summit)</text><text x="180" y="116" font-size="17" fill="#10212B" text-anchor="middle" font-weight="400" >Nước thấm xuống</text><text x="180" y="140" font-size="17" fill="#10212B" text-anchor="middle" font-weight="400" >hoặc chảy tràn chậm</text><text x="430" y="90" font-size="20" fill="#0F6B55" text-anchor="middle" font-weight="700" >Vai sườn (shoulder)</text><text x="430" y="116" font-size="17" fill="#10212B" text-anchor="middle" font-weight="400" >Dốc, chảy tràn mạnh</text><text x="430" y="140" font-size="17" fill="#10212B" text-anchor="middle" font-weight="400" >Xói mòn mạnh, đất mỏng</text><text x="690" y="240" font-size="20" fill="#0F6B55" text-anchor="middle" font-weight="700" >Lưng sườn (backslope)</text><text x="690" y="266" font-size="17" fill="#10212B" text-anchor="middle" font-weight="400" >Phần trên: bị xói</text><text x="690" y="290" font-size="17" fill="#10212B" text-anchor="middle" font-weight="400" >Phần giữa: vận chuyển</text><text x="800" y="380" font-size="20" fill="#0F6B55" text-anchor="middle" font-weight="700" >Chân sườn (footslope)</text><text x="800" y="406" font-size="17" fill="#10212B" text-anchor="middle" font-weight="400" >Dòng vật liệu chậm lại</text><text x="800" y="430" font-size="17" fill="#10212B" text-anchor="middle" font-weight="400" >Bắt đầu lắng đọng</text><text x="1050" y="430" font-size="20" fill="#0F6B55" text-anchor="middle" font-weight="700" >Mũi sườn (toeslope)</text><text x="1050" y="456" font-size="17" fill="#10212B" text-anchor="middle" font-weight="400" >Tích tụ dày dần</text><text x="1050" y="480" font-size="17" fill="#10212B" text-anchor="middle" font-weight="400" >Nhận thêm phù sa sông</text><line x1="300" y1="196" x2="300" y2="270" stroke="#D2492A" stroke-width="2" stroke-dasharray="6 5"/><line x1="470" y1="276" x2="470" y2="350" stroke="#D2492A" stroke-width="2" stroke-dasharray="6 5"/><line x1="700" y1="456" x2="700" y2="530" stroke="#D2492A" stroke-width="2" stroke-dasharray="6 5"/><line x1="900" y1="534" x2="900" y2="608" stroke="#D2492A" stroke-width="2" stroke-dasharray="6 5"/><path d="M500,335 L660,460" stroke="#2F6DB0" stroke-width="4" fill="none"/><polygon points="668,466 648,462 660,446" fill="#2F6DB0"/><text x="455" y="430" font-size="17" fill="#2F6DB0" text-anchor="middle" font-weight="600" >Dòng nước và vật liệu</text><text x="600" y="660" font-size="19" fill="#10212B" text-anchor="middle" font-weight="600" >Vật liệu mịn đi xa hơn, vật liệu thô ở lại trên vai sườn và phần trên lưng sườn</text><text x="600" y="688" font-size="16" fill="#1F4E79" text-anchor="middle" font-weight="400" >Theo Ruhe (1975) trong Schaetzl &amp; Anderson (2005), tr. 470–471. Hình: tác giả vẽ sơ đồ hóa.</text></g><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>