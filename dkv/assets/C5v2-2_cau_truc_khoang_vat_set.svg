<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="Cấu trúc lớp của khoáng vật sét" xmlns:c2pa="http://c2pa.org/manifest"><title>Cấu trúc lớp của khoáng vật sét</title><rect width="1200" height="700" fill="#FFFFFF"/><g style="font-family:'Be Vietnam Pro',system-ui,sans-serif"><text x="600.0" y="40" font-size="26" fill="#1F4E79" text-anchor="middle" font-weight="700" >Cấu trúc lớp của các khoáng vật sét thường gặp (sơ đồ)</text><text x="165.0" y="92" font-size="22" fill="#0F6B55" text-anchor="middle" font-weight="700" >Kaolinit (1:1)</text><text x="455.0" y="92" font-size="22" fill="#0F6B55" text-anchor="middle" font-weight="700" >Illit, mica (2:1)</text><text x="745.0" y="92" font-size="22" fill="#0F6B55" text-anchor="middle" font-weight="700" >Smectit (2:1)</text><text x="1035.0" y="92" font-size="22" fill="#0F6B55" text-anchor="middle" font-weight="700" >Chlorit (2:1:1)</text><polygon points="40,156 290,156 276,130 54,130" fill="#1F4E79"/><text x="165.0" y="149" font-size="15" fill="#fff" text-anchor="middle" font-weight="700" >T</text><rect x="48" y="158" width="234" height="26" fill="#D6A130"/><text x="165.0" y="177" font-size="15" fill="#fff" text-anchor="middle" font-weight="700" >O</text><polygon points="40,242 290,242 276,216 54,216" fill="#1F4E79"/><text x="165.0" y="235" font-size="15" fill="#fff" text-anchor="middle" font-weight="700" >T</text><rect x="48" y="244" width="234" height="26" fill="#D6A130"/><text x="165.0" y="263" font-size="15" fill="#fff" text-anchor="middle" font-weight="700" >O</text><text x="165.0" y="205" font-size="15" fill="#D2492A" text-anchor="middle" font-weight="600" >liên kết hydro</text><text x="165.0" y="310" font-size="18" fill="#10212B" text-anchor="middle" font-weight="400" >d ≈ 7,2 Å; không trương nở</text><polygon points="330,156 580,156 566,130 344,130" fill="#1F4E79"/><text x="455.0" y="149" font-size="15" fill="#fff" text-anchor="middle" font-weight="700" >T</text><rect x="338" y="158" width="234" height="26" fill="#D6A130"/><text x="455.0" y="177" font-size="15" fill="#fff" text-anchor="middle" font-weight="700" >O</text><polygon points="330,186 580,186 566,212 344,212" fill="#1F4E79"/><text x="455.0" y="205" font-size="15" fill="#fff" text-anchor="middle" font-weight="700" >T</text><polygon points="330,276 580,276 566,250 344,250" fill="#1F4E79"/><text x="455.0" y="269" font-size="15" fill="#fff" text-anchor="middle" font-weight="700" >T</text><rect x="338" y="278" width="234" height="26" fill="#D6A130"/><text x="455.0" y="297" font-size="15" fill="#fff" text-anchor="middle" font-weight="700" >O</text><polygon points="330,306 580,306 566,332 344,332" fill="#1F4E79"/><text x="455.0" y="325" font-size="15" fill="#fff" text-anchor="middle" font-weight="700" >T</text><circle cx="360" cy="231" r="10" fill="#D2492A"/><circle cx="398" cy="231" r="10" fill="#D2492A"/><circle cx="436" cy="231" r="10" fill="#D2492A"/><circle cx="474" cy="231" r="10" fill="#D2492A"/><circle cx="512" cy="231" r="10" fill="#D2492A"/><circle cx="550" cy="231" r="10" fill="#D2492A"/><text x="455.0" y="360" font-size="18" fill="#D2492A" text-anchor="middle" font-weight="600" >K⁺ giữ chặt giữa lớp</text><text x="455.0" y="386" font-size="18" fill="#10212B" text-anchor="middle" font-weight="400" >d ≈ 10 Å; không trương nở</text><polygon points="620,156 870,156 856,130 634,130" fill="#1F4E79"/><text x="745.0" y="149" font-size="15" fill="#fff" text-anchor="middle" font-weight="700" >T</text><rect x="628" y="158" width="234" height="26" fill="#D6A130"/><text x="745.0" y="177" font-size="15" fill="#fff" text-anchor="middle" font-weight="700" >O</text><polygon points="620,186 870,186 856,212 634,212" fill="#1F4E79"/><text x="745.0" y="205" font-size="15" fill="#fff" text-anchor="middle" font-weight="700" >T</text><polygon points="620,316 870,316 856,290 634,290" fill="#1F4E79"/><text x="745.0" y="309" font-size="15" fill="#fff" text-anchor="middle" font-weight="700" >T</text><rect x="628" y="318" width="234" height="26" fill="#D6A130"/><text x="745.0" y="337" font-size="15" fill="#fff" text-anchor="middle" font-weight="700" >O</text><polygon points="620,346 870,346 856,372 634,372" fill="#1F4E79"/><text x="745.0" y="365" font-size="15" fill="#fff" text-anchor="middle" font-weight="700" >T</text><rect x="628" y="216" width="234" height="70" fill="#2F6DB0" opacity="0.18"/><circle cx="665" cy="251" r="9" fill="#2F6DB0"/><circle cx="719" cy="251" r="9" fill="#2F6DB0"/><circle cx="773" cy="251" r="9" fill="#2F6DB0"/><circle cx="827" cy="251" r="9" fill="#2F6DB0"/><text x="745.0" y="400" font-size="18" fill="#2F6DB0" text-anchor="middle" font-weight="600" >Cation ngậm nước giữa lớp</text><text x="745.0" y="426" font-size="18" fill="#10212B" text-anchor="middle" font-weight="400" >d ≈ 12,5–15,5 Å; trương nở</text><polygon points="910,156 1160,156 1146,130 924,130" fill="#1F4E79"/><text x="1035.0" y="149" font-size="15" fill="#fff" text-anchor="middle" font-weight="700" >T</text><rect x="918" y="158" width="234" height="26" fill="#D6A130"/><text x="1035.0" y="177" font-size="15" fill="#fff" text-anchor="middle" font-weight="700" >O</text><polygon points="910,186 1160,186 1146,212 924,212" fill="#1F4E79"/><text x="1035.0" y="205" font-size="15" fill="#fff" text-anchor="middle" font-weight="700" >T</text><polygon points="910,276 1160,276 1146,250 924,250" fill="#1F4E79"/><text x="1035.0" y="269" font-size="15" fill="#fff" text-anchor="middle" font-weight="700" >T</text><rect x="918" y="278" width="234" height="26" fill="#D6A130"/><text x="1035.0" y="297" font-size="15" fill="#fff" text-anchor="middle" font-weight="700" >O</text><polygon points="910,306 1160,306 1146,332 924,332" fill="#1F4E79"/><text x="1035.0" y="325" font-size="15" fill="#fff" text-anchor="middle" font-weight="700" >T</text><rect x="918" y="218" width="234" height="26" fill="#46A385"/><text x="1035.0" y="237" font-size="15" fill="#fff" text-anchor="middle" font-weight="700" >O</text><text x="1035.0" y="360" font-size="18" fill="#46A385" text-anchor="middle" font-weight="600" >Tấm hydroxit kim loại</text><text x="1035.0" y="386" font-size="18" fill="#46A385" text-anchor="middle" font-weight="600" >liên tục giữa lớp</text><rect x="40" y="470" width="1120" height="200" rx="12" fill="#F6F7F3" stroke="#D5DCE1"/><text x="64" y="506" font-size="19" fill="#10212B" text-anchor="start" font-weight="600" >T: tấm tứ diện silic (Si–O)     O: tấm bát diện (Al, Mg, Fe – OH)     Lớp = các tấm T và O liên kết với nhau</text><text x="64" y="544" font-size="18" fill="#10212B" text-anchor="start" font-weight="400" >• Thay thế đồng hình (Al³⁺ thay Si⁴⁺; Mg²⁺ thay Al³⁺) tạo điện tích âm của lớp 2:1; lớp 1:1 gần như không có.</text><text x="64" y="576" font-size="18" fill="#10212B" text-anchor="start" font-weight="400" >• Điện tích lớp: mica ≈ 1,0 · illit 0,6–0,8 · vermiculit 0,6–0,9 · smectit 0,2–0,6 (mol trên một ô cơ sở).</text><text x="64" y="608" font-size="18" fill="#10212B" text-anchor="start" font-weight="400" >• Điện tích lớp thấp → lực hút giữa lớp và cation yếu → nước chen vào → smectit trương nở.</text><text x="64" y="646" font-size="16" fill="#1F4E79" text-anchor="start" font-weight="400" >Khoảng cách lớp d: theo Scott &amp; Pain (2009), tr. 48, 54, 56. Hình: tác giả vẽ sơ đồ hóa.</text></g><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>