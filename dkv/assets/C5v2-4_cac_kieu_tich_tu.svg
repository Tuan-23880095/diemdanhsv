<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="Các kiểu tích tụ theo nguồn gốc" xmlns:c2pa="http://c2pa.org/manifest"><title>Các kiểu tích tụ theo nguồn gốc</title><rect width="1200" height="700" fill="#FFFFFF"/><g style="font-family:'Be Vietnam Pro',system-ui,sans-serif"><text x="600.0" y="40" font-size="25" fill="#1F4E79" text-anchor="middle" font-weight="700" >Các kiểu tích tụ theo nguồn gốc trên lát cắt từ đỉnh núi đến lòng sông</text><path d="M40,170 L230,170 L300,185 L360,330 L470,372 L640,455 L760,500 L900,522 L1010,528 L1040,560 L1110,560 L1140,528 L1170,524 L1170,620 L40,620 Z" fill="#D5DCE1"/><path d="M40,170 L230,170 L300,185 L360,330 L470,372 L640,455 L760,500 L900,522 L1010,528 L1040,560 L1110,560 L1140,528 L1170,524" fill="none" stroke="#10212B" stroke-width="3"/><path d="M40,170 L230,170 L300,185 L290,200 L40,196 Z" fill="#D2492A" opacity="0.75"/><path d="M352,312 L372,335 L470,372 L420,340 Z" fill="#10212B" opacity="0.8"/><circle cx="385" cy="330" r="9" fill="#fff" stroke="#10212B" stroke-width="2"/><circle cx="402" cy="342" r="7" fill="#fff" stroke="#10212B" stroke-width="2"/><circle cx="420" cy="350" r="8" fill="#fff" stroke="#10212B" stroke-width="2"/><circle cx="440" cy="358" r="6" fill="#fff" stroke="#10212B" stroke-width="2"/><path d="M470,372 L640,455 L760,500 L640,440 L520,385 Z" fill="#D6A130"/><path d="M700,478 L900,522 L800,470 Z" fill="#46A385"/><path d="M900,522 L1010,528 L1040,560 L1110,560 L1140,528 L1170,524 L1170,545 L1125,575 L1030,575 L1000,545 L900,538 Z" fill="#2F6DB0" opacity="0.85"/><rect x="1042" y="548" width="66" height="12" fill="#BFE3F7"/><text x="150" y="120" font-size="20" fill="#D2492A" text-anchor="middle" font-weight="700" >Eluvi – tàn tích (e)</text><text x="150" y="144" font-size="16" fill="#10212B" text-anchor="middle" font-weight="400" >Phong hóa tại chỗ</text><text x="150" y="166" font-size="16" fill="#10212B" text-anchor="middle" font-weight="400" >không vận chuyển</text><line x1="150" y1="178" x2="150" y2="165" stroke="#D2492A" stroke-width="2" stroke-dasharray="5 4"/><text x="470" y="250" font-size="20" fill="#10212B" text-anchor="middle" font-weight="700" >Coluvi (c)</text><text x="470" y="274" font-size="16" fill="#10212B" text-anchor="middle" font-weight="400" >Đổ lở, trượt lở do trọng lực</text><text x="470" y="296" font-size="16" fill="#10212B" text-anchor="middle" font-weight="400" >kích hoạt bởi động đất,</text><text x="470" y="318" font-size="16" fill="#10212B" text-anchor="middle" font-weight="400" >phá hủy kiến tạo</text><line x1="470" y1="330" x2="400" y2="330" stroke="#10212B" stroke-width="2" stroke-dasharray="5 4"/><text x="560" y="560" font-size="20" fill="#D6A130" text-anchor="middle" font-weight="700" >Deluvi – sườn tích (d)</text><text x="560" y="584" font-size="16" fill="#10212B" text-anchor="middle" font-weight="400" >Nước mưa chảy tràn</text><text x="560" y="606" font-size="16" fill="#10212B" text-anchor="middle" font-weight="400" >rửa trôi vật liệu xuống sườn</text><line x1="560" y1="538" x2="600" y2="445" stroke="#D6A130" stroke-width="2" stroke-dasharray="5 4"/><text x="830" y="400" font-size="20" fill="#0F6B55" text-anchor="middle" font-weight="700" >Proluvi – lũ tích (p)</text><text x="830" y="424" font-size="16" fill="#10212B" text-anchor="middle" font-weight="400" >Dòng chảy tạm thời, lũ</text><text x="830" y="446" font-size="16" fill="#10212B" text-anchor="middle" font-weight="400" >nón phóng vật chân núi</text><line x1="830" y1="458" x2="800" y2="485" stroke="#0F6B55" stroke-width="2" stroke-dasharray="5 4"/><text x="1050" y="440" font-size="20" fill="#2F6DB0" text-anchor="middle" font-weight="700" >Aluvi – bồi tích (a)</text><text x="1050" y="464" font-size="16" fill="#10212B" text-anchor="middle" font-weight="400" >Sông suối thường xuyên</text><text x="1050" y="486" font-size="16" fill="#10212B" text-anchor="middle" font-weight="400" >bãi bồi, thềm sông</text><line x1="1050" y1="498" x2="1060" y2="535" stroke="#2F6DB0" stroke-width="2" stroke-dasharray="5 4"/><text x="600" y="650" font-size="18" fill="#10212B" text-anchor="middle" font-weight="600" >Kiểu trung gian: tàn – sườn tích (ed) · deluvi – proluvi (dp) · aluvi – proluvi (ap) · aluvi – deluvi (ad)</text><text x="600" y="680" font-size="15" fill="#1F4E79" text-anchor="middle" font-weight="400" >Thuật ngữ và ký hiệu theo Đinh Quốc Tuấn (2025), bài giảng Địa chất Đệ tứ, buổi 6. Hình: tác giả vẽ sơ đồ hóa, không theo tỉ lệ.</text></g><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>