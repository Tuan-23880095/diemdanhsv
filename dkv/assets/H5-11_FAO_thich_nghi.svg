<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-label="Quy trình đánh giá thích nghi đất đai theo khung FAO 1976" xmlns:c2pa="http://c2pa.org/manifest"><title>Quy trình đánh giá thích nghi đất đai theo khung FAO 1976</title><rect width="1200" height="720" fill="#FFFFFF"/><g style="font-family:'Be Vietnam Pro',system-ui,sans-serif"><text x="600.0" y="40.0" font-size="25" fill="#1F4E79" text-anchor="middle" font-weight="700" >Từ dữ liệu địa chất đến phân hạng thích nghi và giá trị đất (khung FAO, 1976)</text><rect x="30" y="80" width="345" height="300" rx="14" fill="#FFFFFF" stroke="#1F4E79" stroke-width="3"/><rect x="30" y="80" width="345" height="48" rx="14" fill="#1F4E79"/><rect x="30" y="110" width="345" height="18" fill="#1F4E79"/><text x="202.5" y="112.0" font-size="20" fill="#FFFFFF" text-anchor="middle" font-weight="700" >1. Dữ liệu địa chất</text><text x="48.0" y="164.0" font-size="18" fill="#10212B" text-anchor="start" font-weight="400" >• Đá mẹ, vật liệu mẹ</text><text x="48.0" y="198.0" font-size="18" fill="#10212B" text-anchor="start" font-weight="400" >• Độ dày vỏ phong hoá</text><text x="48.0" y="232.0" font-size="18" fill="#10212B" text-anchor="start" font-weight="400" >• Độ dốc, vị trí catena</text><text x="48.0" y="266.0" font-size="18" fill="#10212B" text-anchor="start" font-weight="400" >• Khoáng vật sét chủ đạo</text><text x="48.0" y="300.0" font-size="18" fill="#10212B" text-anchor="start" font-weight="400" >• Nước ngầm, pyrit, muối</text><text x="48.0" y="334.0" font-size="18" fill="#10212B" text-anchor="start" font-weight="400" >  (bản đồ + phẫu diện)</text><rect x="428" y="80" width="345" height="300" rx="14" fill="#FFFFFF" stroke="#0F6B55" stroke-width="3"/><rect x="428" y="80" width="345" height="48" rx="14" fill="#0F6B55"/><rect x="428" y="110" width="345" height="18" fill="#0F6B55"/><text x="600.5" y="112.0" font-size="20" fill="#FFFFFF" text-anchor="middle" font-weight="700" >2. Chất lượng đất đai</text><text x="446.0" y="164.0" font-size="18" fill="#10212B" text-anchor="start" font-weight="400" >• Giữ dinh dưỡng (CEC)</text><text x="446.0" y="198.0" font-size="18" fill="#10212B" text-anchor="start" font-weight="400" >• Độ sâu tầng hữu hiệu</text><text x="446.0" y="232.0" font-size="18" fill="#10212B" text-anchor="start" font-weight="400" >• Thoát nước, ngập</text><text x="446.0" y="266.0" font-size="18" fill="#10212B" text-anchor="start" font-weight="400" >• Nguy cơ xói, trượt</text><text x="446.0" y="300.0" font-size="18" fill="#10212B" text-anchor="start" font-weight="400" >• Độc tố: phèn, Ni–Cr</text><text x="446.0" y="334.0" font-size="18" fill="#10212B" text-anchor="start" font-weight="400" >• Sức chịu tải nền móng</text><rect x="826" y="80" width="345" height="300" rx="14" fill="#FFFFFF" stroke="#2F6DB0" stroke-width="3"/><rect x="826" y="80" width="345" height="48" rx="14" fill="#2F6DB0"/><rect x="826" y="110" width="345" height="18" fill="#2F6DB0"/><text x="998.5" y="112.0" font-size="20" fill="#FFFFFF" text-anchor="middle" font-weight="700" >3. So với yêu cầu LUT</text><text x="844.0" y="164.0" font-size="18" fill="#10212B" text-anchor="start" font-weight="400" >Loại hình sử dụng đất:</text><text x="844.0" y="198.0" font-size="18" fill="#10212B" text-anchor="start" font-weight="400" >• Cà phê, cao su, lúa</text><text x="844.0" y="232.0" font-size="18" fill="#10212B" text-anchor="start" font-weight="400" >• Rừng phòng hộ</text><text x="844.0" y="266.0" font-size="18" fill="#10212B" text-anchor="start" font-weight="400" >• Đô thị, công trình</text><text x="844.0" y="300.0" font-size="18" fill="#10212B" text-anchor="start" font-weight="400" >Ghép yêu cầu ↔ chất lượng</text><text x="844.0" y="334.0" font-size="18" fill="#10212B" text-anchor="start" font-weight="400" >→ yếu tố hạn chế</text><line x1="375" y1="230" x2="416" y2="230" stroke="#10212B" stroke-width="3"/><polygon points="428,230 412,221 412,239" fill="#10212B"/><line x1="773" y1="230" x2="814" y2="230" stroke="#10212B" stroke-width="3"/><polygon points="826,230 810,221 810,239" fill="#10212B"/><text x="600.0" y="428.0" font-size="22" fill="#10212B" text-anchor="middle" font-weight="700" >4. Phân hạng thích nghi</text><rect x="30" y="446" width="216" height="96" rx="12" fill="#0F6B55"/><text x="138.0" y="488.0" font-size="30" fill="#FFFFFF" text-anchor="middle" font-weight="700" >S1</text><text x="138.0" y="522.0" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="600" >Rất thích nghi</text><rect x="262" y="446" width="216" height="96" rx="12" fill="#46A385"/><text x="370.0" y="488.0" font-size="30" fill="#FFFFFF" text-anchor="middle" font-weight="700" >S2</text><text x="370.0" y="522.0" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="600" >Thích nghi trung bình</text><rect x="494" y="446" width="216" height="96" rx="12" fill="#D6A130"/><text x="602.0" y="488.0" font-size="30" fill="#FFFFFF" text-anchor="middle" font-weight="700" >S3</text><text x="602.0" y="522.0" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="600" >Ít thích nghi</text><rect x="726" y="446" width="216" height="96" rx="12" fill="#D2492A"/><text x="834.0" y="488.0" font-size="30" fill="#FFFFFF" text-anchor="middle" font-weight="700" >N1</text><text x="834.0" y="522.0" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="600" >Hiện chưa thích nghi</text><rect x="958" y="446" width="216" height="96" rx="12" fill="#10212B"/><text x="1066.0" y="488.0" font-size="30" fill="#FFFFFF" text-anchor="middle" font-weight="700" >N2</text><text x="1066.0" y="522.0" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="600" >Vĩnh viễn không thích nghi</text><rect x="30" y="566" width="1140" height="124" rx="14" fill="#F6F7F3" stroke="#D6A130" stroke-width="3"/><text x="54.0" y="602.0" font-size="21" fill="#1F4E79" text-anchor="start" font-weight="700" >5. Đánh giá kinh tế (Kinh tế Đất đai)</text><text x="54.0" y="638.0" font-size="18" fill="#10212B" text-anchor="start" font-weight="400" >Chi phí khắc phục hạn chế (bón vôi, lân; bậc thang chống xói; gia cố móng trên sét trương nở) so với lợi ích ròng</text><text x="54.0" y="670.0" font-size="18" fill="#D2492A" text-anchor="start" font-weight="600" >→ hạng N1 có thể thành S3/S2 nếu đầu tư cải tạo có lãi; N2: hạn chế không thể khắc phục hợp lý về kinh tế</text></g><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>