<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 485" width="900" height="485" font-family="Arial, 'DejaVu Sans', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Catena</title><rect width="900" height="485" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#36454F"/></marker></defs><text x="450" y="26.0" font-size="17" fill="#36454F" text-anchor="middle" font-weight="bold" font-style="normal">Chuỗi đất (catena) trên cùng một đá mẹ granit – vùng nhiệt đới ẩm</text><path d="M40,120 Q160,95 260,130 Q380,190 480,280 Q580,350 720,370 L860,372 L860,440 L40,440 Z" fill="#9A948B"/><path d="M40,120 Q160,95 260,130 Q380,190 480,280 Q580,350 720,370 L860,372 L860,392 L720,392 Q570,372 470,302 Q370,215 255,158 Q160,125 40,150 Z" fill="#C8733F"/><path d="M470,302 Q570,372 720,392 L860,392 L860,405 L720,405 Q560,388 460,318 Z" fill="#D9C7A3"/><path d="M650,392 L860,392 L860,405 L720,405Z" fill="#8C9A86"/><text x="140" y="60.0" font-size="14.5" fill="#5A3E2B" text-anchor="middle" font-weight="bold" font-style="normal">Đỉnh đồi</text><text x="140" y="77.0" font-size="11.5" fill="#333" text-anchor="middle" font-weight="normal" font-style="normal">Đất đỏ vàng, dày, thoát nước tốt;</text><text x="140" y="92.0" font-size="11.5" fill="#333" text-anchor="middle" font-weight="normal" font-style="normal">rửa trôi mạnh, chua</text><text x="390" y="118.0" font-size="14.5" fill="#5A3E2B" text-anchor="middle" font-weight="bold" font-style="normal">Sườn dốc</text><text x="390" y="135.0" font-size="11.5" fill="#333" text-anchor="middle" font-weight="normal" font-style="normal">Đất mỏng, nhiều sạn thạch anh;</text><text x="390" y="150.0" font-size="11.5" fill="#333" text-anchor="middle" font-weight="normal" font-style="normal">xói mòn, sạt lở</text><text x="640" y="245.0" font-size="14.5" fill="#5A3E2B" text-anchor="middle" font-weight="bold" font-style="normal">Chân sườn</text><text x="640" y="262.0" font-size="11.5" fill="#333" text-anchor="middle" font-weight="normal" font-style="normal">Sườn tích dày, cát pha;</text><text x="640" y="277.0" font-size="11.5" fill="#333" text-anchor="middle" font-weight="normal" font-style="normal">tích tụ vật liệu</text><text x="800" y="300.0" font-size="14.5" fill="#5A3E2B" text-anchor="middle" font-weight="bold" font-style="normal">Thung lũng</text><text x="800" y="317.0" font-size="11.5" fill="#333" text-anchor="middle" font-weight="normal" font-style="normal">Đất glây xám xanh, sét;</text><text x="800" y="332.0" font-size="11.5" fill="#333" text-anchor="middle" font-weight="normal" font-style="normal">ngập úng, khử</text><path d="M180,110 C 300,140 420,250 560,330 C 640,370 740,385 820,388" stroke="#3F6E8C" stroke-width="2.5" stroke-dasharray="7 5" fill="none" marker-end="url(#ar)"/><text x="480" y="250.0" font-size="12" fill="#3F6E8C" text-anchor="middle" font-weight="normal" font-style="italic">Dòng nước ngầm – sườn</text><text x="100" y="432.0" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">Đá gốc granit</text><text x="450" y="470.0" font-size="13" fill="#444" text-anchor="middle" font-weight="normal" font-style="italic">Hình 5.8. Catena: địa hình phân bố lại nước và vật liệu, tạo ra dãy đất khác nhau (tác giả vẽ; khái niệm theo Milne, 1935)</text></svg>