<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" font-family="Arial, 'DejaVu Sans', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Mặt cắt vỏ phong hóa</title><rect width="800" height="520" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#36454F"/></marker></defs><text x="400" y="25.0" font-size="17" fill="#36454F" text-anchor="middle" font-weight="bold" font-style="normal">Mặt cắt vỏ phong hóa điển hình vùng nhiệt đới ẩm</text><path d="M120,40 Q200,34 280,40 T440,40 L440,100 Q360,106 280,100 T120,100 Z" fill="#6B4F2A" stroke="#444" stroke-width="1"/><text x="460" y="75.0" font-size="14" fill="#222" text-anchor="start" font-weight="bold" font-style="normal">Đất (tầng A, B)</text><text x="460" y="92.0" font-size="12" fill="#555" text-anchor="start" font-weight="normal" font-style="normal">Đất tàn tích – mất hoàn toàn cấu trúc đá</text><rect x="62" y="57.0" width="44" height="26" rx="4" fill="#fff" stroke="#36454F" stroke-width="1"/><text x="84" y="75.0" font-size="13" fill="#36454F" text-anchor="middle" font-weight="bold" font-style="normal">VI</text><path d="M120,100 Q200,94 280,100 T440,100 L440,155 Q360,161 280,155 T120,155 Z" fill="#8E2F1F" stroke="#444" stroke-width="1"/><text x="460" y="132.5" font-size="14" fill="#222" text-anchor="start" font-weight="bold" font-style="normal">Tầng kết vón / đá ong (laterit)</text><text x="460" y="149.5" font-size="12" fill="#555" text-anchor="start" font-weight="normal" font-style="normal">Kết von Fe, có thể cứng hóa</text><rect x="62" y="114.5" width="44" height="26" rx="4" fill="#fff" stroke="#36454F" stroke-width="1"/><text x="84" y="132.5" font-size="13" fill="#36454F" text-anchor="middle" font-weight="bold" font-style="normal">V</text><path d="M120,155 Q200,149 280,155 T440,155 L440,225 Q360,231 280,225 T120,225 Z" fill="#C0643E" stroke="#444" stroke-width="1"/><text x="460" y="195.0" font-size="14" fill="#222" text-anchor="start" font-weight="bold" font-style="normal">Đới loang lổ (mottled zone)</text><text x="460" y="212.0" font-size="12" fill="#555" text-anchor="start" font-weight="normal" font-style="normal">Trên mực nước ngầm; Fe tái kết tủa thành đốm</text><rect x="62" y="177.0" width="44" height="26" rx="4" fill="#fff" stroke="#36454F" stroke-width="1"/><text x="84" y="195.0" font-size="13" fill="#36454F" text-anchor="middle" font-weight="bold" font-style="normal">V</text><path d="M120,225 Q200,219 280,225 T440,225 L440,315 Q360,321 280,315 T120,315 Z" fill="#E8D8C0" stroke="#444" stroke-width="1"/><text x="460" y="275.0" font-size="14" fill="#222" text-anchor="start" font-weight="bold" font-style="normal">Saprolit (đới nhạt màu)</text><text x="460" y="292.0" font-size="12" fill="#555" text-anchor="start" font-weight="normal" font-style="normal">Giữ cấu trúc đá gốc, bóp vụn bằng tay</text><rect x="62" y="257.0" width="44" height="26" rx="4" fill="#fff" stroke="#36454F" stroke-width="1"/><text x="84" y="275.0" font-size="13" fill="#36454F" text-anchor="middle" font-weight="bold" font-style="normal">IV–V</text><path d="M120,315 Q200,309 280,315 T440,315 L440,375 Q360,381 280,375 T120,375 Z" fill="#B8A995" stroke="#444" stroke-width="1"/><text x="460" y="350.0" font-size="14" fill="#222" text-anchor="start" font-weight="bold" font-style="normal">Saprock (đá phong hóa vừa)</text><text x="460" y="367.0" font-size="12" fill="#555" text-anchor="start" font-weight="normal" font-style="normal">&lt;20% KV dễ phong hóa bị biến đổi; còn cứng</text><rect x="62" y="332.0" width="44" height="26" rx="4" fill="#fff" stroke="#36454F" stroke-width="1"/><text x="84" y="350.0" font-size="13" fill="#36454F" text-anchor="middle" font-weight="bold" font-style="normal">III</text><path d="M120,375 Q200,369 280,375 T440,375 L440,420 Q360,426 280,420 T120,420 Z" fill="#9A948B" stroke="#444" stroke-width="1"/><text x="460" y="402.5" font-size="14" fill="#222" text-anchor="start" font-weight="bold" font-style="normal">Saprock dưới (phong hóa nhẹ)</text><text x="460" y="419.5" font-size="12" fill="#555" text-anchor="start" font-weight="normal" font-style="normal">Đổi màu dọc khe nứt</text><rect x="62" y="384.5" width="44" height="26" rx="4" fill="#fff" stroke="#36454F" stroke-width="1"/><text x="84" y="402.5" font-size="13" fill="#36454F" text-anchor="middle" font-weight="bold" font-style="normal">II</text><path d="M120,420 Q200,414 280,420 T440,420 L440,480 Q360,486 280,480 T120,480 Z" fill="#6F6F73" stroke="#444" stroke-width="1"/><text x="460" y="455.0" font-size="14" fill="#222" text-anchor="start" font-weight="bold" font-style="normal">Đá gốc tươi</text><text x="460" y="472.0" font-size="12" fill="#555" text-anchor="start" font-weight="normal" font-style="normal">Không biến đổi</text><rect x="62" y="437.0" width="44" height="26" rx="4" fill="#fff" stroke="#36454F" stroke-width="1"/><text x="84" y="455.0" font-size="13" fill="#36454F" text-anchor="middle" font-weight="bold" font-style="normal">I</text><ellipse cx="170" cy="345" rx="22" ry="14" fill="#8A8580" stroke="#444"/><ellipse cx="250" cy="345" rx="22" ry="14" fill="#8A8580" stroke="#444"/><ellipse cx="330" cy="345" rx="22" ry="14" fill="#8A8580" stroke="#444"/><ellipse cx="400" cy="345" rx="22" ry="14" fill="#8A8580" stroke="#444"/><circle cx="200" cy="125" r="6" fill="#4A1A10"/><circle cx="300" cy="125" r="6" fill="#4A1A10"/><circle cx="380" cy="125" r="6" fill="#4A1A10"/><text x="84" y="50.0" font-size="12" fill="#36454F" text-anchor="middle" font-weight="bold" font-style="normal">Cấp</text><line x1="30" y1="60" x2="30" y2="470" stroke="#36454F" stroke-width="2" marker-end="url(#ar)"/><text x="22" y="260.0" font-size="13" fill="#36454F" text-anchor="middle" font-weight="normal" font-style="normal">Độ sâu</text><text x="400" y="505.0" font-size="12.5" fill="#444" text-anchor="middle" font-weight="normal" font-style="italic">Hình 4.10. Phân đới vỏ phong hóa và cấp phong hóa I–VI (tác giả vẽ; tổng hợp theo Dearman, 1976; Butt &amp; Zeegers, 1992; Scott &amp; Pain, 2009; Waltham, 2009; tương ứng cấp chỉ gần đúng)</text></svg>