<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="Arial, 'DejaVu Sans', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Phân loại các kiểu phong hóa</title><rect width="800" height="450" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#36454F"/></marker></defs><rect x="300" y="20" width="200" height="50" rx="10" fill="#36454F" stroke="#36454F" stroke-width="1.5"/><text x="400" y="52.0" font-size="20" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">PHONG HÓA</text><line x1="400" y1="70" x2="140" y2="115" stroke="#36454F" stroke-width="2" marker-end="url(#ar)"/><rect x="20" y="118" width="240" height="44" rx="10" fill="#D9B38C" stroke="#36454F" stroke-width="1.5"/><text x="140" y="146.0" font-size="17" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">Phong hóa vật lý</text><rect x="20" y="170" width="240" height="170" rx="8" fill="#FAFAF7" stroke="#D9B38C" stroke-width="1.5"/><circle cx="38" cy="195" r="4" fill="#D9B38C"/><text x="50" y="200.0" font-size="14" fill="#222" text-anchor="start" font-weight="normal" font-style="normal">Giãn nở – co rút nhiệt</text><circle cx="38" cy="226" r="4" fill="#D9B38C"/><text x="50" y="231.0" font-size="14" fill="#222" text-anchor="start" font-weight="normal" font-style="normal">Đóng băng – tan băng</text><circle cx="38" cy="257" r="4" fill="#D9B38C"/><text x="50" y="262.0" font-size="14" fill="#222" text-anchor="start" font-weight="normal" font-style="normal">Kết tinh muối</text><circle cx="38" cy="288" r="4" fill="#D9B38C"/><text x="50" y="293.0" font-size="14" fill="#222" text-anchor="start" font-weight="normal" font-style="normal">Dỡ tải (bóc vỏ, khe nứt tách)</text><circle cx="38" cy="319" r="4" fill="#D9B38C"/><text x="50" y="324.0" font-size="14" fill="#222" text-anchor="start" font-weight="normal" font-style="normal">Hút ẩm – mất nước (sét)</text><line x1="400" y1="70" x2="400" y2="115" stroke="#36454F" stroke-width="2" marker-end="url(#ar)"/><rect x="280" y="118" width="240" height="44" rx="10" fill="#B85042" stroke="#36454F" stroke-width="1.5"/><text x="400" y="146.0" font-size="17" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">Phong hóa hóa học</text><rect x="280" y="170" width="240" height="170" rx="8" fill="#FAFAF7" stroke="#B85042" stroke-width="1.5"/><circle cx="298" cy="195" r="4" fill="#B85042"/><text x="310" y="200.0" font-size="14" fill="#222" text-anchor="start" font-weight="normal" font-style="normal">Hòa tan</text><circle cx="298" cy="226" r="4" fill="#B85042"/><text x="310" y="231.0" font-size="14" fill="#222" text-anchor="start" font-weight="normal" font-style="normal">Thủy phân (silicat)</text><circle cx="298" cy="257" r="4" fill="#B85042"/><text x="310" y="262.0" font-size="14" fill="#222" text-anchor="start" font-weight="normal" font-style="normal">Oxy hóa – khử (Fe, Mn, S)</text><circle cx="298" cy="288" r="4" fill="#B85042"/><text x="310" y="293.0" font-size="14" fill="#222" text-anchor="start" font-weight="normal" font-style="normal">Hydrat hóa</text><circle cx="298" cy="319" r="4" fill="#B85042"/><text x="310" y="324.0" font-size="14" fill="#222" text-anchor="start" font-weight="normal" font-style="normal">Cacbonat hóa; tạo phức</text><line x1="400" y1="70" x2="660" y2="115" stroke="#36454F" stroke-width="2" marker-end="url(#ar)"/><rect x="540" y="118" width="240" height="44" rx="10" fill="#6B8F71" stroke="#36454F" stroke-width="1.5"/><text x="660" y="146.0" font-size="17" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">Phong hóa sinh học</text><rect x="540" y="170" width="240" height="170" rx="8" fill="#FAFAF7" stroke="#6B8F71" stroke-width="1.5"/><circle cx="558" cy="195" r="4" fill="#6B8F71"/><text x="570" y="200.0" font-size="14" fill="#222" text-anchor="start" font-weight="normal" font-style="normal">Rễ cây nêm chèn</text><circle cx="558" cy="226" r="4" fill="#6B8F71"/><text x="570" y="231.0" font-size="14" fill="#222" text-anchor="start" font-weight="normal" font-style="normal">Acid hữu cơ, chelat</text><circle cx="558" cy="257" r="4" fill="#6B8F71"/><text x="570" y="262.0" font-size="14" fill="#222" text-anchor="start" font-weight="normal" font-style="normal">Vi sinh vật (vi khuẩn, nấm)</text><circle cx="558" cy="288" r="4" fill="#6B8F71"/><text x="570" y="293.0" font-size="14" fill="#222" text-anchor="start" font-weight="normal" font-style="normal">Địa y, rêu</text><circle cx="558" cy="319" r="4" fill="#6B8F71"/><text x="570" y="324.0" font-size="14" fill="#222" text-anchor="start" font-weight="normal" font-style="normal">Động vật đào hang</text><text x="150" y="370.0" font-size="13" fill="#5A3E2B" text-anchor="middle" font-weight="normal" font-style="italic">Kết quả: vỡ vụn, tăng diện tích bề mặt</text><text x="400" y="370.0" font-size="13" fill="#5A3E2B" text-anchor="middle" font-weight="normal" font-style="italic">Kết quả: biến đổi thành phần, khoáng vật mới</text><text x="660" y="370.0" font-size="13" fill="#5A3E2B" text-anchor="middle" font-weight="normal" font-style="italic">Kết quả: tăng tốc cả hai quá trình</text><rect x="120" y="392" width="560" height="40" rx="20" fill="#E7E8D1" stroke="#36454F" stroke-width="1.5"/><text x="400" y="418.0" font-size="15" fill="#36454F" text-anchor="middle" font-weight="bold" font-style="normal">Ba quá trình xảy ra đồng thời và cộng hưởng</text></svg>