<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 375" width="900" height="375" font-family="Arial, 'DejaVu Sans', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Đá mẹ đến đất</title><rect width="900" height="375" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#36454F"/></marker></defs><text x="450" y="28.0" font-size="17" fill="#36454F" text-anchor="middle" font-weight="bold" font-style="normal">Chuỗi truyền thừa: đá mẹ → vỏ phong hóa → vật liệu mẹ → đất</text><rect x="20" y="70" width="150" height="60" rx="10" fill="#6F6F73" stroke="#6F6F73" stroke-width="1.5"/><text x="95" y="106.0" font-size="13.5" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">ĐÁ MẸ</text><text x="95" y="155.0" font-size="12" fill="#333" text-anchor="middle" font-weight="normal" font-style="normal">thành phần khoáng vật,</text><text x="95" y="171.0" font-size="12" fill="#333" text-anchor="middle" font-weight="normal" font-style="normal">kiến trúc, khe nứt</text><line x1="172" y1="100" x2="196" y2="100" stroke="#36454F" stroke-width="2" marker-end="url(#ar)"/><rect x="198" y="70" width="150" height="60" rx="10" fill="#C98B2B" stroke="#C98B2B" stroke-width="1.5"/><text x="273" y="106.0" font-size="13.5" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">PHONG HÓA</text><text x="273" y="155.0" font-size="12" fill="#333" text-anchor="middle" font-weight="normal" font-style="normal">phá hủy, hòa tan,</text><text x="273" y="171.0" font-size="12" fill="#333" text-anchor="middle" font-weight="normal" font-style="normal">tạo sét – oxit</text><line x1="350" y1="100" x2="374" y2="100" stroke="#36454F" stroke-width="2" marker-end="url(#ar)"/><rect x="376" y="70" width="150" height="60" rx="10" fill="#B85042" stroke="#B85042" stroke-width="1.5"/><text x="451" y="106.0" font-size="13.5" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">VẬT LIỆU MẸ</text><text x="451" y="155.0" font-size="12" fill="#333" text-anchor="middle" font-weight="normal" font-style="normal">tại chỗ hoặc</text><text x="451" y="171.0" font-size="12" fill="#333" text-anchor="middle" font-weight="normal" font-style="normal">vận chuyển</text><line x1="528" y1="100" x2="552" y2="100" stroke="#36454F" stroke-width="2" marker-end="url(#ar)"/><rect x="554" y="70" width="150" height="60" rx="10" fill="#6B8F71" stroke="#6B8F71" stroke-width="1.5"/><text x="629" y="106.0" font-size="13.5" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">QUÁ TRÌNH TẠO ĐẤT</text><text x="629" y="155.0" font-size="12" fill="#333" text-anchor="middle" font-weight="normal" font-style="normal">hữu cơ, rửa trôi,</text><text x="629" y="171.0" font-size="12" fill="#333" text-anchor="middle" font-weight="normal" font-style="normal">tích tụ, phân tầng</text><line x1="706" y1="100" x2="730" y2="100" stroke="#36454F" stroke-width="2" marker-end="url(#ar)"/><rect x="732" y="70" width="150" height="60" rx="10" fill="#5A3E2B" stroke="#5A3E2B" stroke-width="1.5"/><text x="807" y="106.0" font-size="13.5" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">ĐẤT</text><text x="807" y="155.0" font-size="12" fill="#333" text-anchor="middle" font-weight="normal" font-style="normal">tính chất lý – hóa –</text><text x="807" y="171.0" font-size="12" fill="#333" text-anchor="middle" font-weight="normal" font-style="normal">sinh; độ phì</text><rect x="60" y="210" width="780" height="120" rx="10" fill="#FAF6EF" stroke="#5A3E2B" stroke-width="1.5"/><text x="450" y="238.0" font-size="15" fill="#5A3E2B" text-anchor="middle" font-weight="bold" font-style="normal">Những gì đất "thừa hưởng" từ đá mẹ</text><text x="90" y="270.0" font-size="13.5" fill="#222" text-anchor="start" font-weight="normal" font-style="normal">▸ Thành phần cơ giới (cát – limon – sét)</text><text x="480" y="270.0" font-size="13.5" fill="#222" text-anchor="start" font-weight="normal" font-style="normal">▸ Khoáng vật sét và oxit Fe, Al</text><text x="90" y="298.0" font-size="13.5" fill="#222" text-anchor="start" font-weight="normal" font-style="normal">▸ Dự trữ dinh dưỡng (K, Ca, Mg, P)</text><text x="480" y="298.0" font-size="13.5" fill="#222" text-anchor="start" font-weight="normal" font-style="normal">▸ Màu sắc, độ chua, độ dày tầng đất</text><text x="450" y="360.0" font-size="13" fill="#444" text-anchor="middle" font-weight="normal" font-style="italic">Hình 5.1. Đá mẹ ảnh hưởng đến đất gián tiếp qua vỏ phong hóa (tác giả thiết kế)</text></svg>