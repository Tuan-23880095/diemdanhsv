<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="Phân loại vật liệu mẹ của đất" xmlns:c2pa="http://c2pa.org/manifest"><title>Phân loại vật liệu mẹ của đất</title><rect width="1200" height="700" fill="#FFFFFF"/><g style="font-family:'Be Vietnam Pro',system-ui,sans-serif"><text x="600.0" y="40" font-size="26" fill="#1F4E79" text-anchor="middle" font-weight="700" >Phân loại vật liệu mẹ của đất theo nguồn gốc</text><rect x="450" y="64" width="300" height="62" rx="12" fill="#1F4E79" stroke="#1F4E79" stroke-width="3"/><text x="600.0" y="89.0" font-size="19" fill="#FFFFFF" text-anchor="middle" font-weight="700" >Regolith (lớp vật liệu bở rời</text><text x="600.0" y="115.0" font-size="19" fill="#FFFFFF" text-anchor="middle" font-weight="700" >phủ trên đá gốc)</text><line x1="600" y1="126" x2="210" y2="170" stroke="#10212B" stroke-width="2.5"/><rect x="60" y="170" width="300" height="48" rx="12" fill="#0F6B55" stroke="#0F6B55" stroke-width="3"/><text x="210.0" y="201.0" font-size="19" fill="#FFFFFF" text-anchor="middle" font-weight="700" >Tàn tích (residuum)</text><text x="210" y="246" font-size="18" fill="#10212B" text-anchor="middle" font-weight="400" >Hình thành tại chỗ</text><text x="210" y="272" font-size="18" fill="#10212B" text-anchor="middle" font-weight="400" >Saprolit: còn giữ cấu trúc đá</text><text x="210" y="298" font-size="18" fill="#10212B" text-anchor="middle" font-weight="400" >Tính chất do đá gốc quy định</text><line x1="600" y1="126" x2="600" y2="170" stroke="#10212B" stroke-width="2.5"/><rect x="450" y="170" width="300" height="48" rx="12" fill="#2F6DB0" stroke="#2F6DB0" stroke-width="3"/><text x="600.0" y="201.0" font-size="19" fill="#FFFFFF" text-anchor="middle" font-weight="700" >Vật liệu vận chuyển</text><text x="600" y="246" font-size="18" fill="#10212B" text-anchor="middle" font-weight="400" >Phổ biến hơn tàn tích</text><text x="600" y="272" font-size="18" fill="#10212B" text-anchor="middle" font-weight="400" >Tính chất do nguồn và</text><text x="600" y="298" font-size="18" fill="#10212B" text-anchor="middle" font-weight="400" >cách vận chuyển quy định</text><line x1="600" y1="126" x2="990" y2="170" stroke="#10212B" stroke-width="2.5"/><rect x="840" y="170" width="300" height="48" rx="12" fill="#D6A130" stroke="#D6A130" stroke-width="3"/><text x="990.0" y="201.0" font-size="19" fill="#FFFFFF" text-anchor="middle" font-weight="700" >Vật liệu hữu cơ</text><text x="990" y="246" font-size="18" fill="#10212B" text-anchor="middle" font-weight="400" >Tích tụ khi xác thực vật</text><text x="990" y="272" font-size="18" fill="#10212B" text-anchor="middle" font-weight="400" >phân giải chậm hơn</text><text x="990" y="298" font-size="18" fill="#10212B" text-anchor="middle" font-weight="400" >tốc độ tích lũy</text><text x="60" y="372" font-size="20" fill="#2F6DB0" text-anchor="start" font-weight="700" >Tác nhân vận chuyển:</text><line x1="600" y1="330" x2="172" y2="392" stroke="#2F6DB0" stroke-width="2.5"/><rect x="60" y="392" width="225" height="46" rx="12" fill="#FFFFFF" stroke="#2F6DB0" stroke-width="3"/><text x="172.5" y="422.0" font-size="19" fill="#10212B" text-anchor="middle" font-weight="700" >Nước</text><rect x="60" y="452" width="225" height="84" rx="12" fill="#FFFFFF" stroke="#D5DCE1" stroke-width="3"/><text x="172.5" y="488.0" font-size="18" fill="#10212B" text-anchor="middle" font-weight="400" >Bồi tích (alluvium)</text><text x="172.5" y="514.0" font-size="18" fill="#10212B" text-anchor="middle" font-weight="400" >Trầm tích hồ, biển</text><line x1="600" y1="330" x2="457" y2="392" stroke="#2F6DB0" stroke-width="2.5"/><rect x="345" y="392" width="225" height="46" rx="12" fill="#FFFFFF" stroke="#2F6DB0" stroke-width="3"/><text x="457.5" y="422.0" font-size="19" fill="#10212B" text-anchor="middle" font-weight="700" >Gió</text><rect x="345" y="452" width="225" height="84" rx="12" fill="#FFFFFF" stroke="#D5DCE1" stroke-width="3"/><text x="457.5" y="488.0" font-size="18" fill="#10212B" text-anchor="middle" font-weight="400" >Cát gió, loess</text><text x="457.5" y="514.0" font-size="18" fill="#10212B" text-anchor="middle" font-weight="400" >Tro núi lửa (tephra)</text><line x1="600" y1="330" x2="742" y2="392" stroke="#2F6DB0" stroke-width="2.5"/><rect x="630" y="392" width="225" height="46" rx="12" fill="#FFFFFF" stroke="#2F6DB0" stroke-width="3"/><text x="742.5" y="422.0" font-size="19" fill="#10212B" text-anchor="middle" font-weight="700" >Băng</text><rect x="630" y="452" width="225" height="84" rx="12" fill="#FFFFFF" stroke="#D5DCE1" stroke-width="3"/><text x="742.5" y="488.0" font-size="18" fill="#10212B" text-anchor="middle" font-weight="400" >Vật liệu băng hà</text><text x="742.5" y="514.0" font-size="18" fill="#10212B" text-anchor="middle" font-weight="400" >(drift)</text><line x1="600" y1="330" x2="1027" y2="392" stroke="#2F6DB0" stroke-width="2.5"/><rect x="915" y="392" width="225" height="46" rx="12" fill="#FFFFFF" stroke="#2F6DB0" stroke-width="3"/><text x="1027.5" y="422.0" font-size="19" fill="#10212B" text-anchor="middle" font-weight="700" >Trọng lực</text><rect x="915" y="452" width="225" height="84" rx="12" fill="#FFFFFF" stroke="#D5DCE1" stroke-width="3"/><text x="1027.5" y="488.0" font-size="18" fill="#10212B" text-anchor="middle" font-weight="400" >Sườn tích</text><text x="1027.5" y="514.0" font-size="18" fill="#10212B" text-anchor="middle" font-weight="400" >(colluvium)</text><rect x="60" y="570" width="1080" height="96" rx="12" fill="#F6F7F3" stroke="#D5DCE1"/><text x="84" y="606" font-size="18" fill="#10212B" text-anchor="start" font-weight="400" >Sườn dốc: tàn tích dày khi tốc độ phong hóa lớn hơn tốc độ vận chuyển (sườn giới hạn bởi vận chuyển);</text><text x="84" y="636" font-size="18" fill="#10212B" text-anchor="start" font-weight="400" >tàn tích mỏng khi vật liệu bị mang đi nhanh hơn (sườn giới hạn bởi phong hóa).</text></g><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>