<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 425" width="900" height="425" font-family="Arial, 'DejaVu Sans', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Quy trình tích hợp</title><rect width="900" height="425" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#36454F"/></marker></defs><text x="450" y="26.0" font-size="17" fill="#36454F" text-anchor="middle" font-weight="bold" font-style="normal">Quy trình tích hợp lớp dữ liệu địa chất vào đánh giá – quy hoạch đất</text><rect x="30" y="70" width="190" height="90" rx="12" fill="#FAF6EF" stroke="#B85042" stroke-width="2"/><circle cx="52" cy="92" r="16" fill="#B85042"/><text x="52" y="98.0" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">1</text><text x="135" y="115.0" font-size="13" fill="#222" text-anchor="middle" font-weight="normal" font-style="normal">Xác định mục tiêu</text><text x="135" y="133.0" font-size="13" fill="#222" text-anchor="middle" font-weight="normal" font-style="normal">&amp; loại sử dụng đất (LUT)</text><line x1="220" y1="115" x2="243" y2="115" stroke="#36454F" stroke-width="2" marker-end="url(#ar)"/><rect x="245" y="70" width="190" height="90" rx="12" fill="#FAF6EF" stroke="#B85042" stroke-width="2"/><circle cx="267" cy="92" r="16" fill="#B85042"/><text x="267" y="98.0" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">2</text><text x="350" y="115.0" font-size="13" fill="#222" text-anchor="middle" font-weight="normal" font-style="normal">Thu thập dữ liệu</text><text x="350" y="133.0" font-size="13" fill="#222" text-anchor="middle" font-weight="normal" font-style="normal">địa chất – thực địa</text><line x1="435" y1="115" x2="458" y2="115" stroke="#36454F" stroke-width="2" marker-end="url(#ar)"/><rect x="460" y="70" width="190" height="90" rx="12" fill="#FAF6EF" stroke="#B85042" stroke-width="2"/><circle cx="482" cy="92" r="16" fill="#B85042"/><text x="482" y="98.0" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">3</text><text x="565" y="115.0" font-size="13" fill="#222" text-anchor="middle" font-weight="normal" font-style="normal">Chuẩn hóa: tỷ lệ,</text><text x="565" y="133.0" font-size="13" fill="#222" text-anchor="middle" font-weight="normal" font-style="normal">tọa độ, phân cấp</text><line x1="650" y1="115" x2="673" y2="115" stroke="#36454F" stroke-width="2" marker-end="url(#ar)"/><rect x="675" y="70" width="190" height="90" rx="12" fill="#FAF6EF" stroke="#B85042" stroke-width="2"/><circle cx="697" cy="92" r="16" fill="#B85042"/><text x="697" y="98.0" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">4</text><text x="780" y="115.0" font-size="13" fill="#222" text-anchor="middle" font-weight="normal" font-style="normal">Xây dựng tiêu chí</text><text x="780" y="133.0" font-size="13" fill="#222" text-anchor="middle" font-weight="normal" font-style="normal">&amp; trọng số</text><rect x="137" y="230" width="190" height="90" rx="12" fill="#FAF6EF" stroke="#B85042" stroke-width="2"/><circle cx="159" cy="252" r="16" fill="#B85042"/><text x="159" y="258.0" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">5</text><text x="242" y="275.0" font-size="13" fill="#222" text-anchor="middle" font-weight="normal" font-style="normal">Chồng lớp, tính</text><text x="242" y="293.0" font-size="13" fill="#222" text-anchor="middle" font-weight="normal" font-style="normal">chỉ số, phân hạng</text><line x1="327" y1="275" x2="350" y2="275" stroke="#36454F" stroke-width="2" marker-end="url(#ar)"/><rect x="352" y="230" width="190" height="90" rx="12" fill="#FAF6EF" stroke="#B85042" stroke-width="2"/><circle cx="374" cy="252" r="16" fill="#B85042"/><text x="374" y="258.0" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">6</text><text x="457" y="275.0" font-size="13" fill="#222" text-anchor="middle" font-weight="normal" font-style="normal">Kiểm chứng thực địa</text><text x="457" y="293.0" font-size="13" fill="#222" text-anchor="middle" font-weight="normal" font-style="normal">&amp; nêu giới hạn</text><line x1="542" y1="275" x2="565" y2="275" stroke="#36454F" stroke-width="2" marker-end="url(#ar)"/><rect x="567" y="230" width="190" height="90" rx="12" fill="#FAF6EF" stroke="#B85042" stroke-width="2"/><circle cx="589" cy="252" r="16" fill="#B85042"/><text x="589" y="258.0" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">7</text><text x="672" y="275.0" font-size="13" fill="#222" text-anchor="middle" font-weight="normal" font-style="normal">Khuyến nghị quy hoạch</text><text x="672" y="293.0" font-size="13" fill="#222" text-anchor="middle" font-weight="normal" font-style="normal">&amp; giám sát</text><path d="M770,160 L770,198 L232,198 L232,226" stroke="#36454F" stroke-width="2" fill="none" marker-end="url(#ar)"/><path d="M662,320 L662,350 L15,350 L15,115 L28,115" stroke="#B85042" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#ar)"/><text x="340" y="343.0" font-size="12" fill="#B85042" text-anchor="middle" font-weight="normal" font-style="italic">Vòng lặp hiệu chỉnh khi kết quả kiểm chứng không phù hợp</text><text x="450" y="410.0" font-size="13" fill="#444" text-anchor="middle" font-weight="normal" font-style="italic">Hình 6.2. Bảy bước tích hợp dữ liệu địa chất (tác giả thiết kế; tham khảo FAO, 1976, 2007; Serote, 2004)</text></svg>