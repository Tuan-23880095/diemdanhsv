<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-label="Hàm sản xuất đất so với xói mòn canh tác" xmlns:c2pa="http://c2pa.org/manifest"><title>Hàm sản xuất đất so với xói mòn canh tác</title><rect width="1200" height="720" fill="#FFFFFF"/><g style="font-family:'Be Vietnam Pro',system-ui,sans-serif"><text x="600.0" y="38.0" font-size="26" fill="#1F4E79" text-anchor="middle" font-weight="700" >Tốc độ tạo đất giảm theo độ dày tầng đất – xói mòn canh tác vượt xa</text><rect x="120" y="139.3" width="1030" height="132.5" fill="#D2492A" opacity="0.13"/><text x="1138.0" y="167.3" font-size="19" fill="#D2492A" text-anchor="end" font-weight="600" >Xói mòn đất cày xới thông thường (minh hoạ, ~0,3–3 mm/năm)</text><line x1="120" y1="600.0" x2="1150" y2="600.0" stroke="#D5DCE1" stroke-width="1"/><text x="108.0" y="607.0" font-size="18" fill="#10212B" text-anchor="end" font-weight="400" >0,001</text><line x1="120" y1="467.5" x2="1150" y2="467.5" stroke="#D5DCE1" stroke-width="1"/><text x="108.0" y="474.5" font-size="18" fill="#10212B" text-anchor="end" font-weight="400" >0,01</text><line x1="120" y1="335.0" x2="1150" y2="335.0" stroke="#D5DCE1" stroke-width="1"/><text x="108.0" y="342.0" font-size="18" fill="#10212B" text-anchor="end" font-weight="400" >0,1</text><line x1="120" y1="202.5" x2="1150" y2="202.5" stroke="#D5DCE1" stroke-width="1"/><text x="108.0" y="209.5" font-size="18" fill="#10212B" text-anchor="end" font-weight="400" >1</text><line x1="120" y1="70.0" x2="1150" y2="70.0" stroke="#D5DCE1" stroke-width="1"/><text x="108.0" y="77.0" font-size="18" fill="#10212B" text-anchor="end" font-weight="400" >10</text><line x1="120.0" y1="600" x2="120.0" y2="608" stroke="#10212B"/><text x="120.0" y="632.0" font-size="18" fill="#10212B" text-anchor="middle" font-weight="400" >0</text><line x1="291.7" y1="600" x2="291.7" y2="608" stroke="#10212B"/><text x="291.7" y="632.0" font-size="18" fill="#10212B" text-anchor="middle" fo