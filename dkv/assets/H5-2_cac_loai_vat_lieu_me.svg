<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 465" width="900" height="465" font-family="Arial, 'DejaVu Sans', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Vật liệu mẹ</title><rect width="900" height="465" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#36454F"/></marker></defs><text x="450" y="26.0" font-size="17" fill="#36454F" text-anchor="middle" font-weight="bold" font-style="normal">Vật liệu mẹ tại chỗ và vận chuyển trong một lát cắt cảnh quan</text><path d="M0,420 L0,150 Q80,90 160,110 Q240,130 300,220 Q360,300 470,330 L640,345 Q720,350 780,380 L900,380 L900,420 Z" fill="#9A948B"/><path d="M0,150 Q80,90 160,110 Q240,130 300,220 Q360,300 470,330 L640,345 Q720,350 780,380 L900,380 L900,395 L780,395 Q720,365 640,362 L470,350 Q350,322 290,240 Q230,155 160,135 Q80,118 0,175 Z" fill="#E1B98C"/><path d="M290,240 Q350,322 470,350 L470,332 Q380,305 330,250 Z" fill="#C9A06E"/><path d="M470,350 L640,362 L640,346 L470,331 Z" fill="#D6C6A2"/><path d="M780,395 L900,395 L900,380 L780,380 Z" fill="#B7C9D6"/><path d="M640,345 Q700,340 780,380 L780,395 Q720,365 640,362Z" fill="#8FA27E"/><text x="110" y="185.0" font-size="13.5" fill="#5A3E2B" text-anchor="middle" font-weight="bold" font-style="normal">Tàn tích (eluvi)</text><text x="110" y="202.0" font-size="11.5" fill="#333" text-anchor="middle" font-weight="normal" font-style="normal">phong hóa tại chỗ trên đá gốc</text><text x="330" y="205.0" font-size="13.5" fill="#5A3E2B" text-anchor="middle" font-weight="bold" font-style="normal">Sườn tích (colluvi)</text><text x="330" y="222.0" font-size="11.5" fill="#333" text-anchor="middle" font-weight="normal" font-style="normal">trọng lực, dòng mảnh vụn</text><text x="560" y="300.0" font-size="13.5" fill="#5A3E2B" text-anchor="middle" font-weight="bold" font-style="normal">Lũ tích / bồi tích</text><text x="560" y="317.0" font-size="11.5" fill="#333" text-anchor="middle" font-weight="normal" font-style="normal">dòng chảy mặt, sông</text><text x="720" y="320.0" font-size="13.5" fill="#5A3E2B" text-anchor="middle" font-weight="bold" font-style="normal">Đầm lầy – hữu cơ</text><text x="720" y="337.0" font-size="11.5" fill="#333" text-anchor="middle" font-weight="normal" font-style="normal">than bùn, sét hữu cơ</text><text x="845" y="355.0" font-size="13.5" fill="#5A3E2B" text-anchor="middle" font-weight="bold" font-style="normal">Biển</text><text x="845" y="372.0" font-size="11.5" fill="#333" text-anchor="middle" font-weight="normal" font-style="normal">sét – cát</text><text x="80" y="405.0" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">Đá gốc</text><path d="M600,90 q20,-18 40,0 q20,-18 40,0" stroke="#999" fill="none"/><text x="640" y="70.0" font-size="12" fill="#555" text-anchor="middle" font-weight="normal" font-style="normal">Hoàng thổ (gió) – ít gặp ở VN</text><text x="450" y="450.0" font-size="13" fill="#444" text-anchor="middle" font-weight="normal" font-style="italic">Hình 5.2. Các kiểu vật liệu mẹ theo vị trí địa hình (tác giả vẽ; phỏng theo Birkeland, 1999; Schaetzl &amp; Anderson, 2005)</text></svg>