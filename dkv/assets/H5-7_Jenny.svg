<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 485" width="800" height="485" font-family="Arial, 'DejaVu Sans', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Jenny</title><rect width="800" height="485" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#36454F"/></marker></defs><text x="400" y="28.0" font-size="17" fill="#36454F" text-anchor="middle" font-weight="bold" font-style="normal">Phương trình trạng thái đất: S = f(cl, o, r, p, t, …)  (Jenny, 1941)</text><circle cx="400" cy="250" r="80" fill="#5A3E2B"/><text x="400" y="245.0" font-size="22" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">ĐẤT</text><text x="400" y="270.0" font-size="15" fill="#fff" text-anchor="middle" font-weight="normal" font-style="normal">(S)</text><line x1="400" y1="165" x2="400" y2="130" stroke="#C98B2B" stroke-width="4" marker-end="url(#ar)"/><rect x="300.0" y="60.0" width="200" height="60" rx="14" fill="#C98B2B" stroke="#C98B2B" stroke-width="1.5"/><text x="400.0" y="86.0" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">cl – Khí hậu</text><text x="400.0" y="106.0" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="normal" font-style="normal">nhiệt độ, lượng mưa</text><line x1="481" y1="224" x2="533" y2="213" stroke="#4E7D3A" stroke-width="4" marker-end="url(#ar)"/><rect x="499.7218684219822" y="170.5572809000084" width="200" height="60" rx="14" fill="#4E7D3A" stroke="#4E7D3A" stroke-width="1.5"/><text x="599.7218684219822" y="196.5572809000084" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">o – Sinh vật</text><text x="599.7218684219822" y="216.5572809000084" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="normal" font-style="normal">thực vật, vi sinh, con người</text><line x1="450" y1="319" x2="482" y2="347" stroke="#3F6E8C" stroke-width="4" marker-end="url(#ar)"/><rect x="423.4349029814193" y="349.44271909999156" width="200" height="60" rx="14" fill="#3F6E8C" stroke="#3F6E8C" stroke-width="1.5"/><text x="523.4349029814193" y="375.44271909999156" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">r – Địa hình</text><text x="523.4349029814193" y="395.44271909999156" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="normal" font-style="normal">độ dốc, hướng, vị trí</text><line x1="350" y1="319" x2="318" y2="347" stroke="#B85042" stroke-width="4" marker-end="url(#ar)"/><rect x="176.56509701858067" y="349.44271909999156" width="200" height="60" rx="14" fill="#B85042" stroke="#B85042" stroke-width="1.5"/><text x="276.5650970185807" y="375.44271909999156" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">p – Vật liệu mẹ</text><text x="276.5650970185807" y="395.44271909999156" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="normal" font-style="normal">đá mẹ, trầm tích</text><line x1="319" y1="224" x2="267" y2="213" stroke="#36454F" stroke-width="4" marker-end="url(#ar)"/><rect x="100.27813157801774" y="170.55728090000844" width="200" height="60" rx="14" fill="#36454F" stroke="#36454F" stroke-width="1.5"/><text x="200.27813157801774" y="196.55728090000844" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">t – Thời gian</text><text x="200.27813157801774" y="216.55728090000844" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="normal" font-style="normal">tuổi bề mặt</text><text x="400" y="470.0" font-size="13" fill="#444" text-anchor="middle" font-weight="normal" font-style="italic">Hình 5.7. Năm yếu tố hình thành đất; chương này tập trung vào p và r (tác giả vẽ theo Jenny, 1941)</text></svg>