<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 425" width="960" height="425" font-family="Arial, 'DejaVu Sans', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Con đường khoáng vật thứ sinh</title><rect width="960" height="425" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#36454F"/></marker></defs><text x="400" y="28.0" font-size="16" fill="#36454F" text-anchor="middle" font-weight="bold" font-style="normal">Con đường tạo khoáng vật thứ sinh theo mức độ rửa trôi (phỏng theo Pedro, 1968)</text><rect x="20" y="180" width="150" height="70" rx="8" fill="#D5CBBE" stroke="#36454F" stroke-width="1.5"/><text x="95" y="210.0" font-size="14" fill="#222" text-anchor="middle" font-weight="bold" font-style="normal">Silicat nguyên</text><text x="95" y="230.0" font-size="13" fill="#222" text-anchor="middle" font-weight="normal" font-style="normal">sinh (feldspar,</text><text x="95" y="246.0" font-size="13" fill="#222" text-anchor="middle" font-weight="normal" font-style="normal">mica, pyroxen)</text><line x1="170" y1="215" x2="255" y2="90" stroke="#36454F" stroke-width="2" marker-end="url(#ar)"/><rect x="260" y="60" width="170" height="60" rx="8" fill="#fff" stroke="#8FA8B8" stroke-width="2.5"/><text x="345" y="85.0" font-size="15" fill="#36454F" text-anchor="middle" font-weight="bold" font-style="normal">Bisialit hóa</text><text x="345" y="105.0" font-size="11" fill="#555" text-anchor="middle" font-weight="normal" font-style="normal">Rửa trôi yếu – thoát nước kém</text><line x1="430" y1="90" x2="480" y2="90" stroke="#36454F" stroke-width="2" marker-end="url(#ar)"/><rect x="485" y="60" width="180" height="60" rx="8" fill="#8FA8B8" stroke="#36454F" stroke-width="1.5"/><text x="575" y="96.0" font-size="14" fill="#222" text-anchor="middle" font-weight="bold" font-style="normal">Smectit, vermiculit</text><text x="680" y="96.0" font-size="12" fill="#333" text-anchor="start" font-weight="normal" font-style="normal">Si/Al cao; giữ Ca, Mg, Na</text><line x1="170" y1="215" x2="255" y2="220" stroke="#36454F" stroke-width="2" marker-end="url(#ar)"/><rect x="260" y="190" width="170" height="60" rx="8" fill="#fff" stroke="#E3C9A8" stroke-width="2.5"/><text x="345" y="215.0" font-size="15" fill="#36454F" text-anchor="middle" font-weight="bold" font-style="normal">Monosialit hóa</text><text x="345" y="235.0" font-size="11" fill="#555" text-anchor="middle" font-weight="normal" font-style="normal">Rửa trôi trung bình</text><line x1="430" y1="220" x2="480" y2="220" stroke="#36454F" stroke-width="2" marker-end="url(#ar)"/><rect x="485" y="190" width="180" height="60" rx="8" fill="#E3C9A8" stroke="#36454F" stroke-width="1.5"/><text x="575" y="226.0" font-size="14" fill="#222" text-anchor="middle" font-weight="bold" font-style="normal">Kaolinit (1:1)</text><text x="680" y="226.0" font-size="12" fill="#333" text-anchor="start" font-weight="normal" font-style="normal">Mất cation kiềm; mất một phần Si</text><line x1="170" y1="215" x2="255" y2="350" stroke="#36454F" stroke-width="2" marker-end="url(#ar)"/><rect x="260" y="320" width="170" height="60" rx="8" fill="#fff" stroke="#B85042" stroke-width="2.5"/><text x="345" y="345.0" font-size="15" fill="#36454F" text-anchor="middle" font-weight="bold" font-style="normal">Alit hóa</text><text x="345" y="365.0" font-size="11" fill="#555" text-anchor="middle" font-weight="normal" font-style="normal">Rửa trôi mạnh – nóng ẩm</text><line x1="430" y1="350" x2="480" y2="350" stroke="#36454F" stroke-width="2" marker-end="url(#ar)"/><rect x="485" y="320" width="180" height="60" rx="8" fill="#B85042" stroke="#36454F" stroke-width="1.5"/><text x="575" y="356.0" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">Gibbsit, goethit, hematit</text><text x="680" y="356.0" font-size="12" fill="#333" text-anchor="start" font-weight="normal" font-style="normal">Mất gần hết Si → tích tụ Al, Fe</text><rect x="690" y="0" width="0" height="0"/><text x="480" y="410.0" font-size="13" fill="#444" text-anchor="middle" font-weight="normal" font-style="italic">Hình 4.8. Mức độ mất silic (desilic hóa) quyết định khoáng vật sét và oxit được tạo thành</text></svg>