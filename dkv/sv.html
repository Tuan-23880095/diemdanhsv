<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F6B55">
<title>Học viên Tham gia · Đá và Khoáng vật (LEC10001) - HCMUS</title>
<link rel="icon" type="image/svg+xml" href="assets/logo-sen.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,600;0,8..60,700&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
:root {
  --luc: #0F6B55;
  --luc-non: #46A385;
  --ngoc: #8FE0BD;
  --lam: #1F4E79;
  --muc: #10212B;
  --giay: #F6F7F3;
  --line: #D5DCE1;
  --son: #D2492A;
  --tho: #D6A130;
  --tim: #6B4A9E;
  --mute: #556575;
  --serif: 'Source Serif 4', Georgia, serif;
  --sans: 'Be Vietnam Pro', system-ui, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  font-family: var(--sans);
  background: var(--giay);
  color: var(--muc);
  font-size: 16px;
  line-height: 1.5;
  padding-bottom: env(safe-area-inset-bottom, 20px);
}
.wrap { max-width: 600px; margin: 0 auto; padding: 0 16px; }

header.top {
  background: linear-gradient(110deg, var(--lam), var(--luc));
  color: #fff;
  padding: 12px 0 14px;
  position: sticky;
  top: 0;
  z-index: 50;
  box-shadow: 0 4px 12px rgba(16,33,43,0.12);
}
header.top .wrap { display: flex; align-items: center; gap: 12px; }
header.top img.hc { height: 42px; width: auto; background: #fff; border-radius: 8px; padding: 3px; }
header.top .dqt-logo-o {
  width: 42px; height: 42px; background: #fff; border-radius: 20%; padding: 4px; margin-left: auto; flex: none;
  display: flex; align-items: center; justify-content: center;
}
header.top .dqt-logo-o img { width: 100%; height: 100%; }
header.top h1 { font: 700 17px/1.2 var(--serif); margin: 0; }
header.top p { margin: 2px 0 0; font-size: 12.5px; opacity: .9; }

/* Trình chọn bài học */
.lesson-bar {
  background: #fff;
  border-bottom: 1px solid var(--line);
  padding: 10px 0;
}
.lesson-bar select {
  width: 100%;
  font: 600 15px var(--sans);
  padding: 10px 14px;
  border-radius: 12px;
  border: 1.5px solid var(--line);
  background: var(--giay);
  color: var(--muc);
}

/* Tab hoạt động */
nav.tabs {
  background: var(--giay);
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 68px;
  z-index: 40;
}
nav.tabs .wrap {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 10px 16px;
  scrollbar-width: none;
}
nav.tabs .wrap::-webkit-scrollbar { display: none; }
nav.tabs button {
  flex: none;
  border: 1.5px solid var(--line);
  background: #fff;
  border-radius: 99px;
  padding: 8px 16px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
}
nav.tabs button.on {
  background: var(--luc);
  border-color: var(--luc);
  color: #fff;
}

main { padding: 18px 0 40px; }
.panel { display: none; }
.panel.on { display: block; animation: fade .25s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.card {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 18px 20px;
  margin-bottom: 16px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.03);
}
.card h2 { font: 700 22px var(--serif); margin: 0 0 8px; color: var(--luc); }
.card h3 { font: 700 18px var(--serif); margin: 0 0 8px; }

/* Phần Quiz */
.q-card { margin-bottom: 20px; }
.q-title { font-weight: 700; font-size: 16.5px; margin-bottom: 12px; color: var(--muc); }
.opts { display: grid; gap: 10px; }
.opt-btn {
  display: flex;
  align-items: center;
  gap: 12px;
  border: 2px solid var(--line);
  border-radius: 12px;
  padding: 12px 14px;
  background: #fff;
  cursor: pointer;
  text-align: left;
  font-size: 15.5px;
  transition: all 0.2s;
}
.opt-btn .num-b {
  width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font-weight: 700; flex: none;
}
.opt-btn.correct {
  border-color: var(--luc);
  background: #E8F4EE;
  color: var(--luc);
  font-weight: 700;
}
.opt-btn.wrong {
  border-color: var(--son);
  background: #FBEFEC;
  color: var(--son);
}

/* Phần Thảo luận & Ý kiến */
textarea, input[type=text] {
  width: 100%;
  font: 15.5px var(--sans);
  border: 1.5px solid var(--line);
  border-radius: 12px;
  padding: 12px 14px;
  background: #fff;
  color: var(--muc);
  margin-bottom: 12px;
}
textarea:focus, input[type=text]:focus { outline: 2px solid var(--luc-non); }
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font: 600 16px var(--sans);
  border-radius: 12px;
  padding: 12px 18px;
  border: none;
  cursor: pointer;
  width: 100%;
}
.btn.pri { background: var(--luc); color: #fff; }
.btn.sec { background: var(--lam); color: #fff; }
.btn:hover { opacity: 0.9; }

/* Thông báo đã nộp */
.feed-item {
  background: var(--giay);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px 16px;
  margin-top: 10px;
  font-size: 14.5px;
}
.feed-item b { color: var(--luc); }

@media print {
  .dqt-logo-o { display: none !important; }
}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <img class="hc" src="https://firebasestorage.googleapis.com/v0/b/link-anh-web.firebasestorage.app/o/Logo-chinh-hcmus.png?alt=media&token=9cf3a1de-75f1-493b-8711-fd22c7b98738" alt="HCMUS">
    <div>
      <h1>Đá và Khoáng vật · LEC10001</h1>
      <p>Trang tương tác trực tiếp của Sinh viên</p>
    </div>
    <span class="dqt-logo-o"><img src="assets/logo-sen.svg" alt="Logo hoa sen đọng sương"></span>
  </div>
</header>

<div class="lesson-bar">
  <div class="wrap">
    <select id="svLessonSelect" onchange="switchLesson(this.value)">
      <!-- Render bằng JavaScript -->
    </select>
  </div>
</div>

<nav class="tabs">
  <div class="wrap">
    <button type="button" class="on" onclick="openTab('tab-quiz', this)">⚡ Trắc nghiệm (Quiz)</button>
    <button type="button" onclick="openTab('tab-group', this)">👥 Thảo luận nhóm (TPS)</button>
    <button type="button" onclick="openTab('tab-qa', this)">💬 Đặt câu hỏi (Q&amp;A)</button>
  </div>
</nav>

<main class="wrap">

  <!-- 1. TAB QUIZ TRẮC NGHIỆM -->
  <div id="tab-quiz" class="panel on">
    <div class="card">
      <h2 id="quizLessonTitle">Câu hỏi kiểm tra nhanh</h2>
      <p style="color:var(--mute);margin:0 0 16px">Chọn đáp án của bạn ngay sau khi giảng viên chiếu câu hỏi:</p>
      <div id="quizList">
        <!-- Render danh sách câu hỏi theo bài -->
      </div>
    </div>
  </div>

  <!-- 2. TAB THẢO LUẬN NHÓM (THINK-PAIR-SHARE) -->
  <div id="tab-group" class="panel">
    <div class="card">
      <h2>Hoạt động Thảo luận Nhóm</h2>
      <div id="actContent" style="margin-bottom:16px;background:var(--giay);border-radius:12px;padding:14px">
        <!-- Nội dung hoạt động của bài -->
      </div>
      <label style="display:block;font-weight:700;margin-bottom:6px">Ghi kết quả / ý kiến thảo luận của nhóm bạn:</label>
      <input type="text" id="grpName" placeholder="Tên nhóm (ví dụ: Nhóm 3 - Bàn 2)">
      <textarea id="grpAnswer" rows="4" placeholder="Nhập tóm tắt 3-5 ý nhóm đã thống nhất..."></textarea>
      <button type="button" class="btn pri" onclick="submitGroupWork()">Gửi kết quả lên màn hình lớp</button>
      
      <div id="groupFeedback" style="margin-top:16px">
        <!-- Danh sách ý kiến các nhóm -->
      </div>
    </div>
  </div>

  <!-- 3. TAB ĐẶT CÂU HỎI Q&A -->
  <div id="tab-qa" class="panel">
    <div class="card">
      <h2>Hỏi đáp với Giảng viên (Q&amp;A)</h2>
      <p style="color:var(--mute);margin:0 0 14px">Thắc mắc hoặc vấn đề bạn chưa hiểu rõ trong bài giảng:</p>
      <textarea id="qaText" rows="3" placeholder="Nhập câu hỏi ngắn gọn..."></textarea>
      <button type="button" class="btn sec" onclick="submitQuestion()">Gửi câu hỏi ẩn danh</button>
      
      <div id="qaList" style="margin-top:16px"></div>
    </div>
  </div>

</main>

<script src="slidesData.js"></script>
<script>
var currentIdx = 0;
var lessons = window.SLIDES_DATA || [];

function init() {
  var sel = document.getElementById('svLessonSelect');
  sel.innerHTML = lessons.map(function(l, i) {
    return '<option value="' + i + '">Mục ' + l.code + ' - ' + l.title + '</option>';
  }).join('');

  // Check URL query ?lesson=4-1
  var params = new URLSearchParams(window.location.search);
  var code = params.get('lesson');
  if (code) {
    var f = lessons.findIndex(l => l.code === code);
    if (f >= 0) { currentIdx = f; sel.value = f; }
  }
  renderCurrentLesson();
  loadSavedSubmissions();
}

function switchLesson(val) {
  currentIdx = parseInt(val, 10);
  renderCurrentLesson();
}

function renderCurrentLesson() {
  var cur = lessons[currentIdx];
  if (!cur) return;
  document.getElementById('quizLessonTitle').innerText = 'Mục ' + cur.code + ' · ' + cur.title;

  // Lấy các câu hỏi quiz trong bài
  var qSlides = cur.slides.filter(s => s.type === 'quiz');
  var quizContainer = document.getElementById('quizList');
  if (qSlides.length === 0 || !qSlides[0].qs) {
    quizContainer.innerHTML = '<p style="color:var(--mute)">Bài giảng này không có câu hỏi trắc nghiệm nhanh.</p>';
  } else {
    var allQs = qSlides.flatMap(s => s.qs);
    quizContainer.innerHTML = allQs.map(function(q, qIdx) {
      var optsHtml = q.o.map(function(opt, oIdx) {
        var letter = 'ABCD'[oIdx];
        var isCorrect = (letter === q.a);
        return '<button type="button" class="opt-btn" onclick="checkSvAnswer(this, ' + isCorrect + ', ' + qIdx + ')">' +
          '<span class="num-b">' + letter + '</span>' +
          '<span>' + opt + '</span>' +
        '</button>';
      }).join('');

      return '<div class="q-card">' +
        '<div class="q-title">Câu ' + (qIdx + 1) + '. ' + q.q + '</div>' +
        '<div class="opts">' + optsHtml + '</div>' +
      '</div>';
    }).join('');
  }

  // Lấy hoạt động thảo luận nhóm (act)
  var actSlides = cur.slides.filter(s => s.type === 'act');
  var actBox = document.getElementById('actContent');
  if (actSlides.length > 0) {
    actBox.innerHTML = actSlides.map(function(a, aIdx) {
      return '<div style="' + (aIdx > 0 ? 'margin-top:16px;padding-top:16px;border-top:1px dashed var(--line);' : '') + '">' +
        '<h3 style="color:var(--luc);margin:0 0 6px">' + (actSlides.length > 1 ? 'Hoạt động ' + (aIdx + 1) + ': ' : '') + (a.title || 'Hoạt động thảo luận') + ' (' + (a.time || '10 phút') + ')</h3>' +
        (a.sub ? '<p style="margin:0 0 8px;font-weight:600">' + a.sub + '</p>' : '') +
        '<ul style="margin:0;padding-left:20px;font-size:15px">' +
          (a.bullets || []).map(b => '<li>' + b + '</li>').join('') +
        '</ul>' +
      '</div>';
    }).join('');
  } else {
    actBox.innerHTML = '<p style="color:var(--mute);margin:0">Bài này tập trung vào bài tập cá nhân và thực hành mẫu vật.</p>';
  }
}

function checkSvAnswer(btn, isCorrect, qIdx) {
  var parent = btn.closest('.opts');
  parent.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('correct', 'wrong'));
  if (isCorrect) {
    btn.classList.add('correct');
    broadcastLive('quiz', { qIdx: qIdx, choice: btn.querySelector('.num-b').innerText, correct: true });
  } else {
    btn.classList.add('wrong');
    broadcastLive('quiz', { qIdx: qIdx, choice: btn.querySelector('.num-b').innerText, correct: false });
  }
}

function openTab(tabId, btn) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('on'));
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.remove('on'));
  document.getElementById(tabId).classList.add('on');
  btn.classList.add('on');
}

function submitGroupWork() {
  var grp = document.getElementById('grpName').value.trim() || 'Một nhóm học viên';
  var ans = document.getElementById('grpAnswer').value.trim();
  if (!ans) { alert('Vui lòng nhập ý kiến thảo luận của nhóm!'); return; }
  
  var item = { group: grp, answer: ans, time: new Date().toLocaleTimeString('vi-VN', {hour:'2-digit', minute:'2-digit'}) };
  saveAndRender('groupWorks', item, 'groupFeedback');
  document.getElementById('grpAnswer').value = '';
  broadcastLive('group', item);
  alert('Đã gửi ý kiến nhóm thành công!');
}

function submitQuestion() {
  var q = document.getElementById('qaText').value.trim();
  if (!q) { alert('Vui lòng nhập câu hỏi!'); return; }
  
  var item = { q: q, time: new Date().toLocaleTimeString('vi-VN', {hour:'2-digit', minute:'2-digit'}) };
  saveAndRender('qaListLocal', item, 'qaList');
  document.getElementById('qaText').value = '';
  broadcastLive('qa', item);
  alert('Đã gửi câu hỏi lên bảng diễn giả!');
}

function broadcastLive(type, data) {
  try {
    // Phát qua BroadcastChannel để màn hình slide nhận ngay lập tức
    var ch = new BroadcastChannel('dkv_live_session');
    ch.postMessage({ type: type, lesson: lessons[currentIdx].code, data: data });
  } catch(e) {}
}

function saveAndRender(storageKey, item, targetId) {
  var list = JSON.parse(localStorage.getItem(storageKey) || '[]');
  list.unshift(item);
  localStorage.setItem(storageKey, JSON.stringify(list));
  renderItems(list, targetId);
}

function loadSavedSubmissions() {
  var g = JSON.parse(localStorage.getItem('groupWorks') || '[]');
  renderItems(g, 'groupFeedback');
  var q = JSON.parse(localStorage.getItem('qaListLocal') || '[]');
  renderItems(q, 'qaList');
}

function renderItems(list, targetId) {
  var el = document.getElementById(targetId);
  if (!el) return;
  el.innerHTML = list.slice(0, 5).map(function(it) {
    if (it.group) {
      return '<div class="feed-item"><b>' + it.group + ' (' + it.time + '):</b> ' + it.answer + '</div>';
    } else {
      return '<div class="feed-item"><b>Ẩn danh (' + it.time + '):</b> ' + it.q + '</div>';
    }
  }).join('');
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
