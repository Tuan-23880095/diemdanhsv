# Tự deploy lên Firebase Hosting mỗi khi push lên nhánh main.
# Cần GitHub Secret tên FIREBASE_SERVICE_ACCOUNT (nội dung file khoá JSON của
# service account github-deploy trong project diemdanh-hcmus).
name: Deploy len Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: diemdanh-hcmus
