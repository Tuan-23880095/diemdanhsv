# Deploy lên Firebase Hosting — CHỈ CHẠY TAY (workflow_dispatch) từ GĐ10
# (02/10/2026): trang thật nay chạy trên Hostinger (diemdanhsv.com, PHP +
# MariaDB, hPanel Git auto-deploy từ main). Firebase Hosting chỉ còn là bản
# tĩnh dự phòng; không tự deploy mỗi lần push main nữa để không có hai bản
# "thật" lệch nhau. Cần GitHub Secret FIREBASE_SERVICE_ACCOUNT (khoá JSON của
# service account github-deploy trong project diemdanh-hcmus) nếu chạy tay.
name: Deploy len Firebase Hosting (chay tay)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: diemdanh-hcmus
